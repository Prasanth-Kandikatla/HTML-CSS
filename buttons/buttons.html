<!-- Practicing basic HTML and CSS by creating 
 SUBSCRIBE, JOIN and Tweet buttons of famous websites -->

 <!-- Following two steps for each button 
  1) Create a HTML element 
  2) Style it using CSS -->

<style>
.subscribe-button{
background-color : rgb(193, 11, 11);
		color : white;
		border : none;
		height : 36px;
		width: 120;
		font-size: 15;
		border-radius: 2px;
		cursor: pointer;
		margin-right: 32px;
		transition: opacity 0.15s;
}

.subscribe-button:hover{
	opacity: 0.7;
}
.subscribe-button:active{
	opacity: 0.5;
}

.join-button {
	color : rgb(5, 92, 215);
	background-color: white;
	border-color: rgb(5, 92, 215);
	height: 36px;
	width: 70;
	font-size: 15;
	border-radius: 2px;
	border-width: 1.333;
	border-style: solid;
	cursor: pointer;
	margin-right: 32px;
	transition: background-color 0.15s,
	color 0.15s,
	opacity 0.15s;
}
.join-button:Hover{
	color: white;
	background-color: rgb(5, 92, 215);
}
.join-button:active{
	opacity: 0.5;
}

.tweet-button {
	color : white;
	background-color: rgb(46, 159, 239);
	border: none;
	height: 36px;
	width: 70;
	font-size: 15;
	font-weight: bold;
	border-radius: 18px;
	cursor: pointer;
	margin-right: 32px;
	transition: box-shadow 0.15s,
	opacity 0.15s;
}
.tweet-button:hover{
	box-shadow: 1px 5px 10px rgb(164, 164, 164);
}
.tweet-button:active{
	opacity: 0.5;
}

</style>
  <button class = "subscribe-button">
		SUBSCRIBE
	</button>
  <button class = "join-button">
		JOIN
	</button>
  <button class="tweet-button">
		Tweet
	</button>
